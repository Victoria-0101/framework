<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | One One Thrift Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">ONE ONE THRIFT</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="service.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="bg-white py-5 text-center border-bottom">
        <div class="container">
            <h1 class="display-4 fw-bold">Get In Touch</h1>
            <p class="text-muted">Have questions about our stock? Reach out to us today.</p>
        </div>
    </header>

    <section class="container py-5">
        <div class="row g-5">
            <div class="col-lg-7">
                <div class="card border-0 shadow-sm p-4 rounded-4">
                    <h3 class="fw-bold mb-4">Send us a Message</h3>
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" placeholder="John Doe">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" placeholder="08136910983">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" placeholder="name@example.com">
                            </div>
                            <div class="col-12">
                                <label class="form-label">How can we help?</label>
                                <textarea class="form-control" rows="4" placeholder="I'm interested in the vintage shirts..."></textarea>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Send Message</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="mb-5">
                    <h3 class="fw-bold mb-4">Contact Information</h3>
                    <div class="d-flex mb-3">
                        <div class="contact-icon me-3">📍</div>
                        <p>13 Mbabi Mbayo Oluorogbo street, Ile-Ife, Osun state, Nigeria.</p>
                    </div>
                    <div class="d-flex mb-3">
                        <div class="contact-icon me-3">📞</div>
                        <p><a href="tel:08136910983" class="text-decoration-none text-dark">+234 813 691 0983</a></p>
                    </div>
                    <div class="d-flex mb-3">
                        <div class="contact-icon me-3">📧</div>
                        <p><a href="mailto:oneonethriftstore@gmail.com" class="text-decoration-none text-dark">oneonethriftstore@gmail.com</a></p>
                    </div>
                </div>

                <div class="rounded-4 overflow-hidden shadow-sm" style="height: 250px;">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15833.876251213032!2d4.532321!3d7.472851!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1038289436324d03%3A0x64e26a4b163351d5!2sIle-Ife!5e0!3m2!1sen!2sng!4v1700000000000" 
                        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
                    </iframe>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
